<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vehicle Crime Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      --paper: #f6f1e7;
      --card: rgba(255, 255, 255, 0.86);
      --ink: #1d2733;
      --muted: #52606d;
      --line: #d7d0c4;
      --teal: #1e6f7a;
      --orange: #c96b36;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(30, 111, 122, 0.12), transparent 34%),
        linear-gradient(180deg, #fcfaf6 0%, var(--paper) 100%);
      color: var(--ink);
      font-family: "Source Sans 3", sans-serif;
    }

    main {
      padding: 18px;
    }

    h1 {
      margin: 0 0 6px;
      font: 700 1.55rem/1.1 "Fraunces", serif;
    }

    p {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 1rem;
    }

    #map {
      height: 540px;
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
    }

    .leaflet-control-layers {
      border-radius: 12px;
      border: 1px solid var(--line);
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.1);
    }

    .map-note {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--line);
      font-size: 0.95rem;
    }

    .legend-chip {
      display: inline-block;
      margin-right: 10px;
      font-weight: 600;
    }

    .legend-chip::before {
      content: "";
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 6px;
      border-radius: 50%;
    }

    .legend-chip.teal::before {
      background: var(--teal);
    }

    .legend-chip.orange::before {
      background: var(--orange);
    }
  </style>
</head>
<body>
  <main>
    <h1>Where the pattern moved</h1>
    <p>Toggle the layers to compare the dense 2019 break-in footprint with the 2024 pattern and the 2024 stolen-car map.</p>
    <div id="map"></div>
    <div class="map-note">
      <span class="legend-chip teal">Break-ins</span>
      <span class="legend-chip orange">Motor vehicle theft</span>
      Heat intensity is normalized within each layer, so the map emphasizes concentration rather than raw citywide totals.
    </div>
  </main>
